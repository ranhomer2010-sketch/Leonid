name: PHP admin checks
on:
  push:
    paths:
      - 'admin/**'
      - 'content/site.json'
      - 'site.template.html'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/php-admin-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -v
          php -l admin/lib.php
          php -l admin/index.php
          php -l admin/private/index.php
          php -l scripts/test_cms.php
      - name: Exercise editor and rendering
        run: |
          php scripts/test_cms.php
          php -r 'require "admin/lib.php"; if (render_site(load_json(DATA_FILE)) !== file_get_contents("index.html")) exit(1); echo "Published HTML matches content\n";'
      - name: Check static preview build
        run: |
          python3 scripts/render_static.py
          git diff --exit-code -- index.html
